# Calls the shared reusable workflow (zizmor), pinned by its full commit SHA.
# Only findings of high severity fail the job.

name: zizmor

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/zizmor.yml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/zizmor.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  zizmor:
    name: zizmor
    permissions:
      contents: read
    uses: JuanenRac/JuanenRac/.github/workflows/zizmor.yml@f30085ced6bc4c41f8d3cf075c6b88d7230cf4d9 # main
    with:
      min-severity: high
